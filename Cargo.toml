# =============================================================================
# Unicodex Workspace Configuration
# =============================================================================
# Root Cargo.toml for the Unicodex workspace.
# All Rust modules are managed here with unified version and dependency control.
#
# Unicodex 工作区根配置。
# 所有 Rust 模块在此统一管理版本和依赖。
# =============================================================================

[workspace]
# Use the v3 resolver (default for edition 2024).
# 使用 v3 解析器（edition 2024 的默认行为）。
resolver = "3"
members = [
    # --- Core CLI entry point / 核心 CLI 入口 ---
    "unicodex-core",

    # --- Shared types / 公共类型 ---
    "ucx-types",         # Shared data types for all modules / 所有模块共享的公共类型

    # --- Feature modules / 功能模块 ---
    "ucx-init",          # Project initialization / 项目初始化
    "ucx-build",         # Build & pack UCX files / 构建打包 UCX 文件
    "ucx-parse",         # Parse & read UCX files / 解析读取 UCX 文件
    "ucx-verify",        # Signature & integrity verification / 签名与完整性验证
    "ucx-sign",          # Signing & certificate management / 签名与证书管理
    "ucx-version",       # Version management (git2-based) / 版本管理（基于 git2）
    "ucx-crypto",        # Encryption & decryption / 加密与解密

    # --- Extension modules (planned) / 扩展模块（预留） ---
    # "ucx-audio-book",  # Audio book extension / 有声书扩展
    # "ucx-interactive", # Interactive fiction extension / 互动小说扩展
]

# =============================================================================
# Shared package metadata / 共享包元数据
# =============================================================================
# All workspace members inherit these values via `field.workspace = true`.
# 所有工作区成员通过 `field.workspace = true` 继承这些值。
# =============================================================================
[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unicodex/unicodex"
authors = ["Unicodex Contributors"]
rust-version = "1.85"

# =============================================================================
# Shared dependencies / 共享依赖
# =============================================================================
# All dependencies are declared here with pinned versions.
# Workspace members reference them via `dep.workspace = true`.
#
# 所有依赖在此声明并锁定版本。
# 工作区成员通过 `dep.workspace = true` 引用。
# =============================================================================
[workspace.dependencies]

# --- Internal crates / 内部 crate ---
# These allow cross-module references within the workspace.
# 用于工作区内模块间的互相引用。
ucx-types   = { path = "ucx-types" }
ucx-init    = { path = "ucx-init" }
ucx-build   = { path = "ucx-build" }
ucx-parse   = { path = "ucx-parse" }
ucx-verify  = { path = "ucx-verify" }
ucx-sign    = { path = "ucx-sign" }
ucx-version = { path = "ucx-version" }
ucx-crypto  = { path = "ucx-crypto" }

# --- Hashing / 哈希 ---
blake3 = "1.8"                                       # High-performance hash function / 高性能哈希函数

# --- Cryptography / 密码学 ---
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8", "pem"] }  # Ed25519 signatures with PKCS#8 + PEM support / Ed25519 签名（含 PKCS#8 + PEM 支持）
rand = "0.8"                                         # Random number generation / 随机数生成
pkcs8 = { version = "0.10", features = ["pem", "std"] }  # PKCS#8 private key encoding / PKCS#8 私钥编码
pem-rfc7468 = "0.7"                                  # PEM encoding (RFC 7468) / PEM 编码（RFC 7468）
sha2 = "0.10"                                        # SHA-2 hash functions / SHA-2 哈希函数
rcgen = "0.13"                                       # X.509 certificate generation / X.509 证书生成
x509-cert = "0.2"                                    # X.509 certificate parsing / X.509 证书解析
der = { version = "0.7", features = ["pem", "std"] } # DER/PEM encoding/decoding / DER/PEM 编解码
spki = { version = "0.7", features = ["pem", "std"] }  # Subject Public Key Info / 主体公钥信息
time = "0.3"                                          # Date/time for certificate validity / 证书有效期日期时间
rustls-pki-types = "1"                                # PKI types for rcgen interop / rcgen 互操作 PKI 类型

# --- Symmetric encryption / 对称加密 ---
aes-gcm = "0.11.0-rc.3"                             # AES-256-GCM AEAD encryption / AES-256-GCM AEAD 加密
chacha20poly1305 = "0.11.0-rc.3"                     # ChaCha20-Poly1305 AEAD encryption / ChaCha20-Poly1305 AEAD 加密
aes = "0.9"                                          # AES block cipher (for CBC mode) / AES 分组密码（CBC 模式用）
cbc = { version = "0.2", features = ["alloc"] }      # CBC block cipher mode / CBC 分组密码模式
hmac = "0.12"                                        # HMAC-SHA256 (CBC Encrypt-then-MAC) / HMAC-SHA256（CBC Encrypt-then-MAC）

# --- Key derivation / 密钥派生 ---
argon2 = "0.6.0-rc.8"                               # Argon2id password hashing / Argon2id 口令哈希
pbkdf2 = "0.12"                                      # PBKDF2-HMAC-SHA256 key derivation / PBKDF2-HMAC-SHA256 密钥派生

# --- Memory safety / 内存安全 ---
zeroize = { version = "1", features = ["derive"] }   # Secure memory zeroing / 安全内存清零

# --- Archive / 归档 ---
zip = "8.0"                                          # ZIP archive operations / ZIP 归档操作

# --- Version control / 版本控制 ---
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }  # libgit2 Rust bindings (vendored for CI) / libgit2 的 Rust 绑定（vendored 用于 CI 跨平台编译）

# --- Serialization / 序列化 ---
serde = { version = "1.0", features = ["derive"] }   # Serialization framework / 序列化框架
serde_json = "1.0"                                   # JSON support / JSON 支持
toml = "1.0"                                         # TOML support / TOML 支持

# --- UUID generation / UUID 生成 ---
uuid = { version = "1", features = ["v4"] }          # UUID v4 for UCX ID generation / UCX ID 生成

# --- Encoding / 编码 ---
base64 = "0.22"                                      # Base64 encoding for MANIFEST.MF digests / MANIFEST.MF 摘要编码

# --- File traversal / 文件遍历 ---
walkdir = "2"                                        # Recursive directory traversal / 递归目录遍历

# --- Error handling / 错误处理 ---
thiserror = "2.0"                                    # Library error types / 库错误类型定义
anyhow = "1.0"                                       # Application error handling / 应用级错误处理

# --- CLI / 命令行 ---
clap = { version = "4.5", features = ["derive"] }    # CLI argument parsing / 命令行参数解析

# --- Async runtime / 异步运行时 ---
tokio = { version = "1.49", features = ["full"] }    # Async runtime for network ops / 异步运行时（网络操作）

# --- Logging / 日志 ---
tracing = "0.1"                                      # Structured logging / 结构化日志
tracing-subscriber = { version = "0.3", features = ["env-filter"] }  # Log output formatting / 日志输出格式化
tempfile = "3"                                        # Temporary files for testing / 测试用临时文件

# --- Date/time / 日期时间 ---
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # Date formatting for dates field / dates 字段的日期格式化

# =============================================================================
# Release profile / 发布构建配置
# =============================================================================
# Optimized settings for release builds: maximum optimization, smallest binary.
# 发布构建的优化配置：最大优化等级，最小二进制体积。
# =============================================================================
[profile.release]
opt-level = 3       # Maximum optimization level / 最大优化等级
lto = "fat"         # Full LTO for smallest binary size / 完整 LTO，最小二进制体积
codegen-units = 1   # Single codegen unit for maximum optimization / 单 codegen unit，最大化优化
panic = "abort"     # Abort on panic, reduces binary size / 终止式 panic，减小体积
strip = true        # Strip debug symbols / 去除调试符号
