# =============================================================================
# Dependabot -- 自动依赖更新
# =============================================================================
# 每周检查 Cargo 依赖和 GitHub Actions 版本更新，自动创建 PR。
# =============================================================================

version: 2
updates:
  # Cargo 依赖（Rust crates）
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(cargo)"
    labels:
      - dependencies
    open-pull-requests-limit: 10

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions)"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 5
