# =============================================================================
# ucx-build — Build & pack UCX files
# =============================================================================
# Packages project directories into `.ucx` archive files.
# Handles TOML-to-JSON metadata conversion, MANIFEST.MF generation,
# ZIP archive creation, and optional auto-versioning / auto-signing.
#
# 将项目目录打包为 `.ucx` 归档文件。
# 处理 TOML→JSON 元数据转换、MANIFEST.MF 生成、
# ZIP 归档创建，以及可选的自动版本/自动签名。
# =============================================================================

[package]
name = "ucx-build"
description = "UCX file build and packaging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# --- Internal crates / 内部 crate ---
ucx-types = { workspace = true }
ucx-version = { path = "../ucx-version" }
ucx-crypto = { workspace = true }

# --- Archive / 归档 ---
zip = { workspace = true }

# --- Hashing / 哈希 ---
blake3 = { workspace = true }

# --- Serialization / 序列化 ---
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# --- Error handling / 错误处理 ---
thiserror = { workspace = true }

# --- Logging / 日志 ---
tracing = { workspace = true }

# --- File traversal / 文件遍历 ---
walkdir = { workspace = true }

# --- Date/time / 日期时间 ---
chrono = { workspace = true }                        # Date formatting for modified field / modified 字段的日期格式化

[dev-dependencies]
# --- Temporary files for testing / 测试用临时文件 ---
tempfile = { workspace = true }
