# =============================================================================
# ucx-init — Project initialization module
# =============================================================================
# Creates new UCX project directories, generates `unicodex.toml` config,
# scaffolds standard directory structure, and assigns UCX ID.
#
# 创建新的 UCX 项目目录，生成 `unicodex.toml` 配置，
# 搭建标准目录结构，并分配 UCX ID。
# =============================================================================

[package]
name = "ucx-init"
description = "UCX project initialization"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# --- Internal crates / 内部 crate ---
ucx-types = { workspace = true }          # Shared data types / 公共类型

# --- Serialization / 序列化 ---
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# --- UUID generation / UUID 生成 ---
uuid = { workspace = true }               # UUID v4 for UCX ID generation / UCX ID 生成

# --- Error handling / 错误处理 ---
thiserror = { workspace = true }

# --- Logging / 日志 ---
tracing = { workspace = true }

# --- Date/time / 日期时间 ---
chrono = { workspace = true }                        # Date formatting for dates field / dates 字段的日期格式化

# --- Version control / 版本控制 ---
git2 = { workspace = true }                          # Git repo initialization / Git 仓库初始化

[dev-dependencies]
# --- Testing / 测试 ---
tempfile = { workspace = true }           # Temporary directories for tests / 测试用临时目录
