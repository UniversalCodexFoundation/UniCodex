# =============================================================================
# cargo-deny Configuration / cargo-deny 依赖审计配置
# =============================================================================
# Configuration for `cargo deny` — checks licenses, advisories, bans,
# and dependency sources for the Unicodex workspace.
#
# cargo-deny 配置 — 检查许可证、安全公告、禁用依赖和依赖来源。
# 文档：https://embarkstudios.github.io/cargo-deny/
# =============================================================================

# =============================================================================
# [graph] — Dependency graph configuration / 依赖图配置
# =============================================================================
# Targets to check. We check all three major platforms.
# 检查的目标平台：Linux、Windows、macOS。
# =============================================================================
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
]

# =============================================================================
# [advisories] — Security advisory checking / 安全公告检查
# =============================================================================
# Checks dependencies against the RustSec Advisory Database.
# 根据 RustSec 安全公告数据库检查依赖。
# =============================================================================
[advisories]
# Deny any dependency with a known vulnerability.
# 拒绝任何已知存在漏洞的依赖。
vulnerability = "deny"

# Warn on unmaintained crates (not a hard failure).
# 对不再维护的 crate 发出警告（不视为硬失败）。
unmaintained = "warn"

# Warn on yanked crate versions.
# 对已 yank 的 crate 版本发出警告。
yanked = "warn"

# Warn on crates with open, unresolved advisories.
# 对有未解决公告的 crate 发出警告。
notice = "warn"

# =============================================================================
# [licenses] — License compliance checking / 许可证合规检查
# =============================================================================
# Ensures all dependencies use licenses compatible with the project's
# MIT license.
#
# 确保所有依赖使用与项目 MIT 许可证兼容的许可证。
# =============================================================================
[licenses]
# Deny any unlicensed dependency.
# 拒绝任何无许可证的依赖。
unlicensed = "deny"

# Allow these SPDX-compatible licenses.
# 允许以下 SPDX 兼容许可证。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
]

# =============================================================================
# [bans] — Dependency bans and duplicate detection / 依赖禁止与重复检测
# =============================================================================
# Controls banning of specific crates and detection of duplicate versions.
# 控制特定 crate 的禁用及重复版本检测。
# =============================================================================
[bans]
# Warn on multiple versions of the same crate in the dependency tree.
# 当依赖树中存在同一 crate 的多个版本时发出警告。
multiple-versions = "warn"

# Warn on wildcard dependencies (e.g., `dep = "*"`).
# 对通配符依赖发出警告。
wildcards = "warn"

# =============================================================================
# [sources] — Allowed dependency sources / 允许的依赖来源
# =============================================================================
# Restricts where crates can be fetched from.
# 限制 crate 的获取来源。
# =============================================================================
[sources]
# Only allow crates from crates.io.
# 仅允许来自 crates.io 的 crate。
unknown-registry = "deny"

# Deny crates sourced from git repositories (except workspace members).
# 拒绝来自 git 仓库的 crate（工作区成员除外）。
unknown-git = "deny"

# Allow dependencies from the local workspace (path dependencies).
# 允许来自本地工作区的依赖（path 依赖）。
allow-org = { github = ["unicodex"] }
