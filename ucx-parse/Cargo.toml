# =============================================================================
# ucx-parse — Parse & read UCX files
# =============================================================================
# Parses `.ucx` archive files, extracts metadata and chapter content.
# This is the primary module for reader/viewer integration.
#
# 解析 `.ucx` 归档文件，提取元数据和章节内容。
# 这是阅读器/查看器集成的核心模块。
# =============================================================================

[package]
name = "ucx-parse"
description = "UCX file parsing and content extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# --- Internal crates / 内部 crate ---
# Shared types (Codex, Structure, Manifest, etc.) / 公共类型
ucx-types = { workspace = true }
# Encryption support for UCXE detection / 加密支持（UCXE 检测）
ucx-crypto = { workspace = true }

# --- Archive / 归档 ---
zip = { workspace = true }

# --- Hashing / 哈希 ---
blake3 = { workspace = true }

# --- Encoding / 编码 ---
# Base64 encoding for MANIFEST.MF hash digest comparison / MANIFEST.MF 哈希摘要对比用 Base64 编码
base64 = { workspace = true }

# --- Serialization / 序列化 ---
serde = { workspace = true }
serde_json = { workspace = true }

# --- Error handling / 错误处理 ---
thiserror = { workspace = true }

# --- Constant-time comparison / 常量时间比较 ---
subtle = { workspace = true }

# --- Logging / 日志 ---
tracing = { workspace = true }

[dev-dependencies]
# --- Temporary files for testing / 测试用临时文件 ---
tempfile = { workspace = true }
