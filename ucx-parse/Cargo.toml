# =============================================================================
# ucx-parse — Parse & read UCX files
# =============================================================================
# Parses `.ucx` archive files, extracts metadata and chapter content.
# This is the primary module for reader/viewer integration.
#
# 解析 `.ucx` 归档文件，提取元数据和章节内容。
# 这是阅读器/查看器集成的核心模块。
# =============================================================================

[package]
name = "ucx-parse"
