# =============================================================================
# unicodex-core — CLI entry point for the UCX tool
# =============================================================================
# This crate is the unified CLI entry that depends on all ucx-* feature modules.
# It compiles into the `ucx` binary. It contains NO business logic itself;
# each subcommand delegates to the corresponding module's public API.
#
# 本 crate 是统一的 CLI 入口，依赖所有 ucx-* 功能模块。
# 编译产物为 `ucx` 命令。自身不包含业务逻辑，
# 每个子命令都代理到对应模块的公开 API。
# =============================================================================

[package]
name = "unicodex-core"
description = "Unicodex CLI — unified novel file standard tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The compiled binary is named `ucx`.
# 编译产物命名为 `ucx`。
[[bin]]
name = "ucx"
path = "src/main.rs"

[dependencies]
# --- Internal modules / 内部模块 ---
# The CLI entry depends on ALL feature modules.
# CLI 入口依赖所有功能模块。
ucx-types   = { workspace = true }
ucx-init    = { workspace = true }
ucx-build   = { workspace = true }
ucx-parse   = { workspace = true }
ucx-verify  = { workspace = true }
ucx-sign    = { workspace = true }
ucx-version = { workspace = true }
ucx-crypto  = { workspace = true }

# --- CLI framework / 命令行框架 ---
clap = { workspace = true }
# No-echo passphrase prompt (the passphrase must NOT be echoed to the terminal).
# 无回显口令输入（口令不得回显到终端）。
rpassword = { workspace = true }

# --- Encoding / 编码 ---
# Base64 decoding for encryption keys passed via CLI.
# Base64 解码，用于 CLI 传入的加密密钥。
base64 = { workspace = true }

# --- Memory safety / 内存安全 ---
# Zero passphrases and decrypted plaintext from memory after use.
# 使用后将口令与解密明文从内存清零。
zeroize = { workspace = true }

# --- Error handling / 错误处理 ---
# CLI uses `anyhow` for ergonomic error propagation.
# CLI 层使用 `anyhow` 进行便捷的错误传播。
anyhow = { workspace = true }

# --- Logging / 日志 ---
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# --- Serialization / 序列化 ---
serde_json = { workspace = true }         # JSON output for ucx info --json / ucx info --json 的 JSON 输出

# --- Date/Time / 日期时间 ---
chrono = { workspace = true }             # Timestamps for version management / 版本管理时间戳

[dev-dependencies]
# --- Testing / 测试 ---
tempfile = { workspace = true }           # Temporary directories for integration tests / 集成测试用临时目录
serde_json = { workspace = true }         # JSON serialization for test data / 测试数据 JSON 序列化
