# =============================================================================
# ucx-crypto — Encryption & decryption module
# =============================================================================
# Provides chapter-level, resource-level, and paragraph-level encryption
# for UCX files. Supports AES-256-GCM (recommended), ChaCha20-Poly1305,
# and AES-256-CBC with HMAC-SHA256. Handles UCXE binary format,
# key derivation (Argon2id / PBKDF2), and chunked encryption for large files.
#
# 为 UCX 文件提供章节级、资源级和段落级加密。
# 支持 AES-256-GCM（推荐）、ChaCha20-Poly1305 和 AES-256-CBC + HMAC-SHA256。
# 处理 UCXE 二进制格式、密钥派生（Argon2id / PBKDF2）和大文件分块加密。
# =============================================================================

[package]
name = "ucx-crypto"
description = "UCX encryption and decryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# --- Symmetric encryption / 对称加密 ---
aes-gcm = { workspace = true }          # AES-256-GCM AEAD
chacha20poly1305 = { workspace = true }  # ChaCha20-Poly1305 AEAD
aes = { workspace = true }              # AES block cipher (CBC mode)
cbc = { workspace = true }              # CBC block cipher mode
hmac = { workspace = true }             # HMAC-SHA256 (Encrypt-then-MAC)

# --- Key derivation / 密钥派生 ---
argon2 = { workspace = true }           # Argon2id password hashing
pbkdf2 = { workspace = true }           # PBKDF2-HMAC-SHA256

# --- Hashing / 哈希 ---
sha2 = { workspace = true }             # SHA-256 for HMAC and PBKDF2

# --- Random / 随机数 ---
rand = { workspace = true }             # CSPRNG for IV/Nonce/Salt generation

# --- Memory safety / 内存安全 ---
zeroize = { workspace = true }          # Secure memory zeroing

# --- Encoding / 编码 ---
base64 = { workspace = true }           # Base64 for paragraph-level encryption

# --- Serialization / 序列化 ---
serde = { workspace = true }
serde_json = { workspace = true }

# --- Error handling / 错误处理 ---
thiserror = { workspace = true }

# --- Logging / 日志 ---
tracing = { workspace = true }

[dev-dependencies]
# --- Testing / 测试 ---
tempfile = { workspace = true }
